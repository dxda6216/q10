# GitHub Actions workflow: builds Q10Calculator.exe on a Windows runner.
# Save this file in your repository as  .github/workflows/build-exe.yml
# Then: GitHub -> Actions -> "Build Windows EXE" -> Run workflow,
# and download "Q10Calculator-windows" from the finished run's Artifacts.
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name Q10Calculator q10_calculator.py
      - uses: actions/upload-artifact@v4
        with:
          name: Q10Calculator-windows
          path: dist/Q10Calculator.exe
